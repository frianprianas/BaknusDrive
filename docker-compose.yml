version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - baknus_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8082:8080"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=baknuspassword
      - DB_NAME=baknusdrive
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_SYSTEM_TOKEN=BAKNUS_SECRET_INTERNAL_KEY_999
      - ONLYOFFICE_DS_URL=http://onlyoffice-ds
    depends_on:
      - postgres
      - redis
    networks:
      - baknus_network

  forms:
    build:
      context: ./backend-forms
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8083:8080"
    volumes:
      - ./backend-forms:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=baknuspassword
      - DB_NAME=baknusdrive
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://backend:8080
      - INTERNAL_SYSTEM_TOKEN=BAKNUS_SECRET_INTERNAL_KEY_999
    depends_on:
      - postgres
      - redis
    networks:
      - baknus_network

  onlyoffice-ds:
    image: onlyoffice/documentserver:latest
    restart: always
    ports:
      - "0.0.0.0:8084:80"
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    networks:
      - baknus_network

  postgres:
    image: postgres:15-alpine
    restart: always
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=baknuspassword
      - POSTGRES_DB=baknusdrive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baknusdrive"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baknus_network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxclients 10000
    volumes:
      - redis_data:/data
    networks:
      - baknus_network

volumes:
  postgres_data:
  redis_data:
  onlyoffice_data:
  onlyoffice_logs:

networks:
  baknus_network:
    driver: bridge
